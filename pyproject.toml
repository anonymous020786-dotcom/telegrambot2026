[project]
name = "telegram-media-bot"
version = "1.0.0"
description = "Private Telegram bot that downloads public videos, audio and images from any website, with 130+ commands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "python-telegram-bot[job-queue,rate-limiter]>=22,<23",
  "yt-dlp>=2026.8.19",
  "gallery-dl>=1.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.7",
  "aiohttp>=3.10",
  "qrcode[pil]>=8",
  "Pillow>=10",
  "psutil>=6",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "ASYNC", "SIM", "RUF"]
# ASYNC240: stat()/mkdir() on local files are microsecond calls, not worth a thread hop.
# ASYNC109: explicit timeout parameters are intentional for subprocess helpers.
ignore = ["RUF001", "RUF003", "E501", "SIM105", "ASYNC240", "ASYNC109"]
